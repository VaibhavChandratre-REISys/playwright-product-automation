debug=false
name = PropertiesLogsConfig

# Console Appenders
appender.error.type = Console
appender.error.name = StdoutErrorFatal
appender.error.target = SYSTEM_OUT
appender.error.layout.type = PatternLayout
appender.error.layout.pattern = %m%n
appender.error.filter.threshold.type = ThresholdFilter
appender.error.filter.threshold.level = error

appender.warn.type = Console
appender.warn.name = StdoutWarn
appender.warn.target = SYSTEM_OUT
appender.warn.layout.type = PatternLayout
appender.warn.layout.pattern = %m%n
appender.warn.filter.type = LevelRangeFilter
appender.warn.filter.minLevel = warn
appender.warn.filter.maxLevel = warn

appender.info.type = Console
appender.info.name = StdoutInfo
appender.info.target = SYSTEM_OUT
appender.info.layout.type = PatternLayout
appender.info.layout.pattern = %m%n
appender.info.filter.type = LevelRangeFilter
appender.info.filter.minLevel = info
appender.info.filter.maxLevel = info

appender.debug.type = Console
appender.debug.name = StdoutDebug
appender.debug.target = SYSTEM_OUT
appender.debug.layout.type = PatternLayout
appender.debug.layout.pattern = %m%n
appender.debug.filter.type = LevelRangeFilter
appender.debug.filter.minLevel = debug
appender.debug.filter.maxLevel = debug

appender.trace.type = Console
appender.trace.name = StdoutTrace
appender.trace.target = SYSTEM_OUT
appender.trace.layout.type = PatternLayout
appender.trace.layout.pattern = %m%n
appender.trace.filter.type = LevelRangeFilter
appender.trace.filter.minLevel = trace
appender.trace.filter.maxLevel = trace

# Root Logger
rootLogger.level = info
rootLogger.appenderRefs = error, warn, info, debug, trace
rootLogger.appenderRef.error.ref = StdoutErrorFatal
rootLogger.appenderRef.warn.ref = StdoutWarn
rootLogger.appenderRef.info.ref = StdoutInfo
rootLogger.appenderRef.debug.ref = StdoutDebug
rootLogger.appenderRef.trace.ref = StdoutTrace

# Specific Logger
# Logger for com.some.package
logger.com-some-package.name = com.some.package
logger.com-some-package.level = trace
logger.com-some-package.additivity = false
logger.com-some-package.appenderRefs = trace
