PageInstructionText=The program construct of grants and awards that are managed throughout a program's life cycle. The program is approved and maintained by the program office.Program Manager (PM) is an authorised user that can create a program and who can also assign internal users to review/approve it. When a program is initiated it will start with a status of \\u2018Created\\u2019.The status for a created \\u2018Internal Program' that is submitted for approval by a pm will change to \\u2018Send for Approval\\u2019. a new task will be created for all assigned program approvers. Program approvers can review the program and are required to provide feedback/comments prior to approving. once approved the status is set to \\u2018Approved\\u2019. Program owner can see comments provided by program approver in \\u2018history\\u2019 tab and \\u2018active\\u2019 the program. once activated the status is set to \\u2018Active\\u2019 .
